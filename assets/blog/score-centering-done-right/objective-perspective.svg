<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc">
<title id="title">Two objectives, three estimators</title>
<desc id="desc">All responses are sampled from q. IS and TIS optimize the training objective by weighting samples. SC optimizes the inference objective with the trainer Jacobian as a surrogate. DRSC repairs that Jacobian using the checkpoint displacement.</desc>
<rect width="640" height="510" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#262626">
<text x="320" y="38" font-size="28">Rollouts from inference policy q</text>
<g fill="#f7f7f7" stroke="#ddd"><rect x="10" y="65" width="620" height="135" rx="6"/><rect x="10" y="215" width="620" height="135" rx="6"/><rect x="10" y="365" width="620" height="135" rx="6"/></g>
<g stroke="#ddd"><path d="M180 85V180M180 235V330M180 385V480"/></g>
<g font-size="28"><text x="95" y="140">IS / TIS</text><text x="95" y="290">SC</text><text x="95" y="440" fill="#ad543b">DRSC</text></g>
<g font-size="27"><text x="405" y="104">Optimize Eₚ[R]</text><text x="405" y="254">Optimize E<tspan baseline-shift="sub" font-size="19">q</tspan>[R]</text><text x="405" y="404">Optimize E<tspan baseline-shift="sub" font-size="19">q</tspan>[R]</text></g>
<g font-size="25" fill="#666"><text x="405" y="143">Weight p/q (capped for TIS)</text><text x="405" y="179">Backward: Jₚ</text><text x="405" y="293">Forward: z<tspan baseline-shift="sub" font-size="18">q</tspan></text><text x="405" y="329">Backward: Jₚ</text><text x="405" y="443">Forward: z<tspan baseline-shift="sub" font-size="18">q</tspan></text><text x="405" y="479" fill="#ad543b">Backward: Jₚ + DJₚ[Δ]</text></g>
</g></svg>
